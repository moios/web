let mx=innerWidth/2,my=innerHeight/2;
function lightInk(){document.querySelectorAll(".ink").forEach(el=>{const r=el.getBoundingClientRect();
 const d=Math.hypot(mx-(r.left+r.width/2),my-(r.top+r.height/2));el.style.color=d<160?"#f3d9a4":"#2a2018"})}
function move(x,y){mx=x;my=y;const r=document.documentElement.style;r.setProperty("--x",x+"px");r.setProperty("--y",y+"px");lightInk()}
addEventListener("mousemove",e=>move(e.clientX,e.clientY));
addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
addEventListener("touchstart",e=>{const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
addEventListener("scroll",lightInk,{passive:true});
$("reiniciar").onclick=()=>{reset();go("intro")};
reset();go("intro");
</script>
</body>
</html>
